<div class="screen center-div-container">
  <div>
    <div>
      <input type="text" placeholder="Username" [formControl]="username" />
    </div>
    <div>
      <input type="password" placeholder="Password" [formControl]="password" />
    </div>
    <button (click)="login()">Login</button>
    <div style="display: flex; align-items: center;">
      <div style="flex-grow: 1;"><hr /></div>
      <div style="padding: 5px;">OR</div>
      <div style="flex-grow: 1;"><hr /></div>
    </div>
    <button style="width: 100%;" (click)="loginWithSSO()">Login with Sheridan SSO</button>
  </div>
</div>
